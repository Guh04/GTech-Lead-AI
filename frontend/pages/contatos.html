<div class="page-head">
  <div>
    <h1>Contatos</h1>
    <p>Chame os leads no WhatsApp com um clique: a mensagem já vai pronta, sem copiar número. Leads sem WhatsApp ficam separados, com atalhos para resolver.</p>
  </div>
</div>

<div id="ct-status" style="margin-bottom:16px"></div>

<section class="card">
  <div class="card-body stack">
    <div class="row" style="justify-content:space-between">
      <div class="seg-group" id="ct-tabs" style="grid-template-columns:repeat(2,minmax(150px,1fr));min-width:320px">
        <label><input type="radio" name="ct-tab" value="with" checked><span data-tab-label="with">Com WhatsApp</span></label>
        <label><input type="radio" name="ct-tab" value="without"><span data-tab-label="without">Sem WhatsApp</span></label>
      </div>
      <div class="row" style="gap:18px">
        <label class="row" style="gap:8px;font-size:13px;cursor:pointer;flex-wrap:nowrap">
          <input type="checkbox" id="ct-no-site" checked>
          <span>Só sem site nem landing page</span>
        </label>
        <label class="row" style="gap:8px;font-size:13px;cursor:pointer;flex-wrap:nowrap">
          <input type="checkbox" id="ct-only-new" checked>
          <span>Ocultar quem já foi chamado</span>
        </label>
      </div>
    </div>
    <div class="table-wrap" id="ct-list"></div>
  </div>
</section>
